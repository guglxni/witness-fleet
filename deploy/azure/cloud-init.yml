#cloud-config
package_update: true
package_upgrade: false
packages:
  - docker.io
  - curl
  - ca-certificates
  - jq
runcmd:
  - [systemctl, enable, --now, docker]
  - [mkdir, -p, /opt/witness-fleet/data, /opt/witness-fleet/graph, /opt/witness-fleet/caddy-data, /opt/witness-fleet/caddy-config]
  - [chown, '10001:10001', /opt/witness-fleet/data]
  - [chmod, '750', /opt/witness-fleet/data]
  - [sh, -c, 'curl -fsSL https://aka.ms/InstallAzureCLIDeb | bash']
