name: witness-fleet
services:
  graph:
    image: falkordb/falkordb@sha256:107455e862a824e45e8e9f5a7fbfdf5e00a08b14e13eae2577c72fd9e3f59ba6
    container_name: witness-fleet-graph
    environment:
      BROWSER: "0"
      REDIS_ARGS: "--appendonly yes --appendfsync always --aclfile /etc/witness/roles.acl"
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - graph-data:/var/lib/falkordb/data
      - ./config:/etc/witness:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--user", "wf_health", "-a", "", "--no-auth-warning", "ping"]
      interval: 3s
      timeout: 2s
      retries: 20
  app-graph:
    image: falkordb/falkordb@sha256:107455e862a824e45e8e9f5a7fbfdf5e00a08b14e13eae2577c72fd9e3f59ba6
    container_name: witness-fleet-app-graph
    environment:
      BROWSER: "0"
      REDIS_ARGS: "--appendonly yes --appendfsync always --aclfile /etc/witness/roles.acl"
    ports:
      - "127.0.0.1:6381:6379"
    volumes:
      - app-graph-data:/var/lib/falkordb/data
      - ./config:/etc/witness:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--user", "wf_health", "-a", "", "--no-auth-warning", "ping"]
      interval: 3s
      timeout: 2s
      retries: 20
volumes:
  graph-data:
    name: witness-fleet-graph-data
  app-graph-data:
    name: witness-fleet-app-graph-data
