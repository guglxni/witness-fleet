name: Verification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      MUJOCO_GL: egl
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
      - name: Install native simulation libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libglfw3
      - name: Fetch the exact corpus SDK revision
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/FalkorDB/GraphRAG-SDK.git .research/vendor/FalkorDB--GraphRAG-SDK
          git -C .research/vendor/FalkorDB--GraphRAG-SDK fetch origin 35e67a0b27fdcc7f2c28508b09e86169851a8187
          git -C .research/vendor/FalkorDB--GraphRAG-SDK checkout --detach 35e67a0b27fdcc7f2c28508b09e86169851a8187
      - name: Install locked environments
        run: |
          uv sync --frozen --extra dev --extra simulator --python 3.12
          uv sync --frozen --python 3.12 --project services/corpus
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: demo/package-lock.json
      - name: Build packaged hosted interface
        run: npm ci --prefix demo && npm run build --prefix demo
      - name: Lint
        run: .venv/bin/ruff check src services scripts tests
      - name: Start the corpus role fixture on this ephemeral runner
        run: |
          docker compose up -d --wait graph
          docker compose exec -T graph redis-cli --user wf_corpus GRAPH.QUERY wf:demo:corpus 'RETURN 1'
      - name: Complete isolated test manifest
        run: .venv/bin/python scripts/test_all.py
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-verification
          path: artifacts/verification/
          retention-days: 14
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        directory: [web, site, demo]
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        if: matrix.directory == 'web'
      - name: Install the inert local operator API for browser tests
        if: matrix.directory == 'web'
        run: uv sync --frozen --extra dev --extra simulator --python 3.12 --project ..
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-${{ matrix.directory }}
          path: |
            ${{ matrix.directory }}/playwright-report/
            ${{ matrix.directory }}/test-results/
          if-no-files-found: ignore
          retention-days: 14
